name: Test SPM

on:
  push:
    branches: stable
  pull_request:

jobs:
  macos:
    name: Test SPM macOS
    runs-on: macos-12
    steps:
      - 
        name: Checkout
        uses: actions/checkout@v3
      - 
        name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - 
        name: Cache SPM
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      -
        name: Test Command
        run: bundle exec rake spm:test_command
