name: SwiftLint

on:
  push:
    branches: stable
  pull_request:

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-12
    steps:
      - 
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - 
        name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      -
        name: Lint source code
        run: bundle exec rake lint:code