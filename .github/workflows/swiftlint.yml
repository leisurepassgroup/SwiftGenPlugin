name: SwiftLint

on:
  push:
    branches: stable
  pull_request:

jobs:
  lint:
    name: SwiftLint
    runs-on: macos-12
    steps:
      - 
        name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - 
        name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      -
        name: Lint source code
        run: bundle exec rake lint:code